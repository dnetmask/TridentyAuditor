# Tras el primer `docker compose up`, crea la cuenta Super Admin con:
#   docker compose exec api python scripts/create_super_admin.py admin@netmask.co --name "Nombre"
name: tridentyauditor

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tridenty
      POSTGRES_PASSWORD: tridenty
      POSTGRES_DB: tridentyauditor
    ports:
      - "5432:5432"
    volumes:
      - tridenty_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tridenty"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ../backend
    environment:
      TRIDENTY_DATABASE_URL: postgresql+psycopg2://tridenty:tridenty@db:5432/tridentyauditor
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  api:
    build:
      context: ../backend
    environment:
      TRIDENTY_ENVIRONMENT: local
      TRIDENTY_DATABASE_URL: postgresql+psycopg2://tridenty:tridenty@db:5432/tridentyauditor
      TRIDENTY_JWT_SECRET: dev-secret-change-me
      TRIDENTY_CORS_ORIGINS: http://localhost:5173
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ../frontend
    environment:
      # El navegador corre en el host, no en la red de Docker, así que debe
      # apuntar al puerto publicado del host (8001), no al puerto interno
      # del contenedor api (8000).
      VITE_API_BASE_URL: http://localhost:8001
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  tridenty_pgdata:
