# Un solo `docker compose up --build` levanta Postgres + la API, que sirve
# también el frontend ya compilado en el mismo puerto (ver
# backend/app/main.py::SPAStaticFiles) — no hace falta Node/npm en el host.
#
# Para desarrollo activo del frontend con hot-reload (Vite dev server en
# :5173 en vez del build estático), agregar el override:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Primera cuenta Super Admin: definir TRIDENTY_SUPER_ADMIN_EMAIL/_PASSWORD
# más abajo antes del primer arranque, o crearla a mano después con:
#   docker compose exec api python scripts/create_super_admin.py admin@netmask.co --name "Nombre"
#
# Seguridad (Fase S1):
# - La API se conecta como `tridenty_app` (rol sin SUPERUSER ni ownership →
#   RLS real); solo el job de migraciones usa el rol dueño. Ver db-init/.
# - Postgres NO publica su puerto al host: solo la API lo alcanza por la red
#   interna de compose. Para inspeccionar la BD: `docker compose exec db psql -U tridenty tridentyauditor`.
# - Las contraseñas de abajo son defaults de DESARROLLO; en cualquier
#   servidor real, definir POSTGRES_PASSWORD / TRIDENTY_APP_DB_PASSWORD /
#   TRIDENTY_JWT_SECRET en un .env que no se versione.
# - Si el volumen tridenty_pgdata ya existía antes de la Fase S1, el rol
#   tridenty_app no existe todavía: `docker compose down -v` para
#   re-inicializar, o correr deploy/db-init/01-app-role.sh a mano.
name: tridentyauditor

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tridenty
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tridenty}
      POSTGRES_DB: tridentyauditor
      TRIDENTY_APP_DB_PASSWORD: ${TRIDENTY_APP_DB_PASSWORD:-tridenty_app}
    volumes:
      - tridenty_pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tridenty"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: tridentyauditor-api:local
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      # Rol DUEÑO de las tablas — solo migraciones.
      TRIDENTY_DATABASE_URL: postgresql+psycopg2://tridenty:${POSTGRES_PASSWORD:-tridenty}@db:5432/tridentyauditor
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  api:
    image: tridentyauditor-api:local
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      TRIDENTY_ENVIRONMENT: local
      # Rol de APLICACIÓN — sin SUPERUSER ni ownership, sujeto a RLS.
      TRIDENTY_DATABASE_URL: postgresql+psycopg2://tridenty_app:${TRIDENTY_APP_DB_PASSWORD:-tridenty_app}@db:5432/tridentyauditor
      TRIDENTY_JWT_SECRET: ${TRIDENTY_JWT_SECRET:-dev-secret-change-me}
      TRIDENTY_CORS_ORIGINS: http://localhost:5173
      # Opcional — ver comentario de cabecera. Vacías por defecto: sin
      # ambas, el arranque no crea ninguna cuenta y sigue el flujo manual.
      TRIDENTY_SUPER_ADMIN_EMAIL: ${TRIDENTY_SUPER_ADMIN_EMAIL:-}
      TRIDENTY_SUPER_ADMIN_PASSWORD: ${TRIDENTY_SUPER_ADMIN_PASSWORD:-}
      # Binarios de MOD·DOC (documentos subidos) — en un volumen aparte para
      # que sobrevivan a `docker compose down` igual que la base de datos.
      TRIDENTY_DOCUMENTS_STORAGE_DIR: /app/data/documents
    ports:
      - "8001:8000"
    volumes:
      - tridenty_documents:/app/data/documents
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  tridenty_pgdata:
  tridenty_documents:
