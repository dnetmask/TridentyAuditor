{{- if .Values.migrationJob.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "tridentyauditor.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "tridentyauditor.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade,pre-install
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: {{ include "tridentyauditor.fullname" . }}-config
            # Credenciales del rol dueño de las tablas — solo este job las ve.
            - secretRef:
                name: {{ .Values.migrationJob.existingSecret }}
{{- end }}
