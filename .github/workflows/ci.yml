name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tridenty
          POSTGRES_PASSWORD: tridenty
          POSTGRES_DB: tridentyauditor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tridenty"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TRIDENTY_DATABASE_URL: postgresql+psycopg2://tridenty:tridenty@localhost:5432/tridentyauditor_test
      TRIDENTY_JWT_SECRET: test-secret
      TRIDENTY_ADMIN_BOOTSTRAP_TOKEN: test-admin-token
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v
